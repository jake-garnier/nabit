[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nabit"
version = "0.5.0"
description = "nab your agent's silent failures — verify LLM-agent outcomes against real system state, with self-heal. Zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Jake Garnier", email = "jakegarnier@gmail.com" }]
keywords = ["llm", "agents", "verification", "observability", "reliability", "langgraph", "langchain", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []  # zero runtime dependencies, by design

[project.urls]
Homepage = "https://jakegarnier.com/agent-reliability-kit"
Source = "https://github.com/jake-garnier/nabit"

[project.optional-dependencies]
langgraph = ["langchain-core>=0.2"]
celery = ["celery>=5.0"]
dev = ["pytest>=7", "pytest-asyncio>=0.21", "langchain-core>=0.2", "celery>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["nabit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
